<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座位分配 - NightStriker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 座位分配页（Excel 极简风格） ===== */
    .seat-desc {
      color: #64748B;
      font-size: 0.9rem;
      margin: -12px 0 24px;
    }

    .seat-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .seat-card h2 {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.1rem;
      color: #1E293B;
      margin-bottom: 14px;
    }

    /* ---- 行列配置 ---- */
    .seat-config-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .seat-config-row label {
      font-size: 0.85rem;
      color: #475569;
    }

    .seat-config-row input[type="number"] {
      width: 64px;
      padding: 6px 8px;
      border: 1px solid #CBD5E1;
      font-size: 0.9rem;
      font-family: inherit;
      background: #FFFFFF;
      color: #1E293B;
    }

    .seat-config-row input[type="number"]:focus {
      outline: none;
      border-color: #1E293B;
    }

    .btn-seat {
      padding: 7px 14px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      color: #1E293B;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-seat:hover { border-color: #1E293B; }

    .btn-seat-primary {
      background: #1E293B;
      border-color: #1E293B;
      color: #FFFFFF;
    }
    .btn-seat-primary:hover { background: #334155; }

    .btn-seat:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ---- 画笔工具栏 ---- */
    .paint-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #E2E8F0;
    }

    .paint-toolbar .paint-hint {
      font-size: 0.78rem;
      color: #94A3B8;
      margin-left: auto;
    }

    .paint-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
    }
    .paint-btn:hover { border-color: #1E293B; }
    .paint-btn.active {
      border-color: #1E293B;
      background: #1E293B;
      color: #FFFFFF;
    }

    .paint-swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    /* ---- 状态行 ---- */
    .seat-status {
      font-size: 0.85rem;
      color: #64748B;
      margin-bottom: 10px;
    }
    .seat-status strong { color: #1E293B; }

    /* ---- 座位网格（Excel 单元格风） ---- */
    .seat-stage {
      width: 100%;
      overflow-x: auto;
      padding: 4px 0;
    }

    .seat-grid {
      display: grid;
      gap: 2px;
      width: 100%;
      margin: 0 auto;
    }

    .seat-cell {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      padding: 0 2px;
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .seat-cell:hover { transform: scale(1.04); }

    .seat-cell.type-seat {
      background: #FFFFFF;
      border: 1px solid #9CA3AF;
      color: #1E293B;
    }

    .seat-cell.type-seat.pending {
      background: #F3F4F6;
      border: 1px solid #9CA3AF;
      color: #9CA3AF;
      font-size: 0.85rem;
    }

    .seat-cell.type-seat.filled {
      background: #FFFFFF;
      border: 1px solid #111827;
      color: #111827;
      font-weight: 600;
      cursor: default;
    }
    .seat-cell.type-seat.filled:hover { transform: none; }

    .seat-cell.type-seat.filled.same {
      background: #FEF3C7;
      border: 1px solid #F59E0B;
      color: #92400E;
    }

    .same-tag {
      display: inline-block;
      margin-left: 3px;
      font-size: 0.55rem;
      font-weight: 700;
      color: #B45309;
      background: #FDE68A;
      border-radius: 2px;
      padding: 0 3px;
      line-height: 1.3;
      vertical-align: 1px;
    }

    .seat-cell.type-seat.filled.flip {
      animation: flipIn 0.35s ease-out;
    }

    @keyframes flipIn {
      0%   { transform: perspective(300px) rotateY(90deg); opacity: 0.3; }
      100% { transform: perspective(300px) rotateY(0); opacity: 1; }
    }

    .seat-cell.type-empty {
      background: #FFFFFF;
      border: 1px dashed #D1D5DB;
      color: #D1D5DB;
      font-size: 0.72rem;
    }

    .seat-cell.type-gap {
      border: none;
      background: transparent;
      cursor: default;
    }
    .seat-cell.type-gap:hover { transform: none; }

    /* ---- 图例 ---- */
    .seat-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #64748B;
    }

    .seat-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ---- 名单输入 ---- */
    .name-input-wrap {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    #nameInput {
      flex: 1;
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      border: 1px solid #CBD5E1;
      font-size: 0.9rem;
      font-family: inherit;
      background: #FFFFFF;
      color: #1E293B;
      resize: vertical;
      line-height: 1.7;
    }

    #nameInput:focus {
      outline: none;
      border-color: #1E293B;
    }

    .name-count {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #64748B;
    }
    .name-count.warn { color: #B91C1C; font-weight: 600; }

    .name-format-hint {
      font-size: 0.78rem;
      color: #94A3B8;
      margin-top: 6px;
    }

    /* ---- 操作按钮 ---- */
    .seat-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-seat-lg {
      padding: 10px 22px;
      font-size: 0.95rem;
    }

    /* ---- 打印 ---- */
    @media print {
      .navbar, .seat-config-row, .paint-toolbar, .seat-legend,
      .seat-actions, .name-input-wrap, .name-count, .name-format-hint,
      .footer, .seat-desc { display: none !important; }

      body { background: #FFFFFF; }
      .tools-section { padding: 0; }
      .seat-card { border: none; padding: 0; margin: 0; }
      .seat-status { margin-bottom: 8px; }
      .seat-cell { border: 1px solid #000 !important; color: #000 !important; background: #FFF !important; }
      .seat-cell.type-seat.filled.same { border: 2px solid #000 !important; }
      .same-tag { border: 1px solid #000 !important; background: #FFF !important; color: #000 !important; }
      .seat-cell.type-gap { border: none !important; }
      .seat-cell.type-empty { border: 1px dashed #999 !important; color: #999 !important; }
    }

    /* ---- 响应式 ---- */
    @media (max-width: 600px) {
      .seat-card { padding: 14px; }
      .paint-toolbar .paint-hint { display: none; }
      .name-input-wrap { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo"><img src="favicon.png" alt="NightStriker">NightStriker</a>
      <div class="nav-links">
        <a href="index.html#about">关于我</a>
        <a href="blog.html">博客</a>
        <a href="tools.html">工具箱</a>
        <a href="SeatAllocation.html" style="color:#1E293B;font-weight:700">座位分配</a>
      </div>
    </div>
  </nav>

  <section class="tools-section">
    <div class="container">

      <h1 class="tools-title">🪑 座位分配</h1>
      <p class="seat-desc">输入行列数与学生姓名即可分配，如有特殊情况可使用「空位」来调整。保证分配随机。</p>

      <!-- 布局与结果（合二为一：分配结果直接显示在网格上） -->
      <div class="seat-card">
        <h2>座位布局</h2>

        <div class="seat-config-row">
          <label>行数 <input type="number" id="rowInput" min="1" max="20" value="6"></label>
          <label>列数 <input type="number" id="colInput" min="1" max="20" value="8" title="每排座位数（两列一组，自动留过道）"></label>
          <button class="btn-seat" id="genGridBtn">生成网格</button>
          <button class="btn-seat" id="resetLayoutBtn">重置为默认</button>
        </div>

        <div class="paint-toolbar">
          <button class="paint-btn active" data-paint="seat"><span class="paint-swatch" style="background:#FFFFFF"></span>座位</button>
          <button class="paint-btn" data-paint="empty"><span class="paint-swatch" style="background:#FFFFFF"></span>空位</button>
          <span class="paint-hint">💡 点击或拖拽涂格子；「下载表格」可以一键下载表格，也可以使用「复制表格」粘贴到 Excel 中使用。</span>
        </div>

        <div class="seat-status" id="seatStatus"></div>

        <div class="seat-stage">
          <div class="seat-grid" id="seatGrid"></div>
        </div>

        <div class="seat-legend">
          <span class="seat-legend-item"><span class="paint-swatch" style="background:#FFFFFF"></span>座位</span>
          <span class="seat-legend-item"><span class="paint-swatch" style="background:#FFFFFF"></span>空位</span>
          <span class="seat-legend-item"><span class="paint-swatch" style="background:transparent"></span>过道</span>
          <span class="seat-legend-item"><span class="paint-swatch" style="background:#FEF3C7;border-color:#F59E0B"></span>同性同桌</span>
        </div>
      </div>

      <!-- 名单输入 -->
      <div class="seat-card">
        <h2>输入名单</h2>
        <div class="name-input-wrap">
          <textarea id="nameInput" placeholder="张三（男） 李四（女） 王五（男）&#10;赵六（女） 钱七（男） 孙八（女）&#10;（姓名后可用括号标性别，可不标；空格分隔）"></textarea>
        </div>
        <p class="name-count" id="nameCount">已识别 <strong>0</strong> 人</p>
        <p class="name-format-hint">格式：姓名之间用空格分隔，性别用括号标注（如「张三（男） 李四（女）」），全角（）半角()均可，不标也行。男女同桌优先，多出的人同性同桌会以橙色标注。</p>
      </div>

      <!-- 操作 -->
      <div class="seat-actions">
        <button class="btn-seat btn-seat-primary btn-seat-lg" id="startBtn">🎲 开始分配</button>
        <button class="btn-seat btn-seat-lg" id="skipBtn" disabled>⏭ 跳过动画</button>
        <button class="btn-seat btn-seat-lg" id="clearBtn" disabled>🧹 清空结果</button>
        <button class="btn-seat btn-seat-lg" id="copyTextBtn" disabled>📋 复制文本</button>
        <button class="btn-seat btn-seat-lg" id="copyExcelBtn" disabled>📋 复制表格</button>
        <button class="btn-seat btn-seat-lg" id="downloadCsvBtn" disabled>⬇️ 下载表格</button>
      </div>

    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2026 NightStriker. All rights reserved.</p>
    </div>
  </footer>

  <script src="seat-allocation.js"></script>
</body>
</html>
