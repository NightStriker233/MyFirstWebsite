<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏 - NightStriker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">✦ NightStriker</a>
      <div class="nav-links">
        <a href="index.html#about">关于我</a>
        <a href="index.html#messages">留言板</a>
        <a href="blog.html">博客</a>
        <a href="tools.html">工具箱</a>
        <a href="games.html" style="color:#1E293B;font-weight:700">游戏</a>
        <a href="SeatAllocation.html">座位分配</a>
      </div>
    </div>
  </nav>

  <section class="tools-section">
    <div class="container">
      <h1 class="tools-title">🎮 小游戏</h1>
      <div class="tools-tabs" id="tabsNav">
        <button class="tools-tab active" data-tab="minesweeper">💣 扫雷</button>
        <button class="tools-tab" data-tab="tfe">🔢 2048</button>
        <button class="tools-tab" data-tab="life">🧩 生命游戏</button>
      </div>

      <div class="tools-panel active" id="panel-minesweeper">
        <div class="game-bar"><span id="mineStatus">💣 10</span><button class="btn-secondary btn-sm" id="mineReset">🔄 新游戏</button><span id="mineTimer" style="margin-left:auto">⏱ 0</span></div>
        <canvas id="mineCanvas" class="game-canvas"></canvas>
      </div>

      <div class="tools-panel" id="panel-tfe">
        <div class="game-bar"><span>🏆 得分：<strong id="tfeScore">0</strong></span><button class="btn-secondary btn-sm" id="tfeReset">🔄 新游戏</button><span style="margin-left:auto;font-size:0.8rem;color:#94A3B8">方向键 / 触屏滑动</span></div>
        <div class="tfe-board" id="tfeBoard"></div>
      </div>

      <div class="tools-panel" id="panel-life">
        <div class="game-bar"><span>🧫 世代：<strong id="lifeGen">0</strong></span><button class="btn-secondary btn-sm" id="lifePlay">▶ 播放</button><button class="btn-secondary btn-sm" id="lifeStep">⏭ 单步</button><button class="btn-secondary btn-sm" id="lifeRandom">🎲 随机</button><button class="btn-secondary btn-sm" id="lifeClear">🗑 清空</button><span style="margin-left:auto;font-size:0.8rem;color:#94A3B8">拖拽绘制 / 点击切换</span></div>
        <canvas id="lifeCanvas" class="game-canvas"></canvas>
      </div>
    </div>
  </section>

  <script src="games.js"></script>
</body>
</html>
