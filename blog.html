<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 — NightStriker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script>
    // 管理链接：blog.html?key=xxx 自动保存密码
    (function() {
      var params = new URLSearchParams(window.location.search);
      var key = params.get('key');
      if (key) {
        localStorage.setItem('blog_key', key);
        window.history.replaceState({}, '', window.location.pathname);
      }
    })();
  </script>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo"><img src="favicon.png" alt="">NightStriker</a>
      <div class="nav-links">
        <a href="index.html#about">关于</a>
        <a href="blog.html" aria-current="page">博客</a>
        <a href="tools.html">工具箱</a>
        <a href="SeatAllocation.html">座位分配</a>
      </div>
    </div>
  </nav>

  <section class="blog-section">
    <div class="container">

      <!-- 列表 -->
      <div id="listView">
        <div class="blog-header">
          <h1>博客</h1>
          <div style="display:flex;gap:8px;align-items:center">
            <input type="text" id="blogSearch" class="form-input" placeholder="搜索标题或标签……" aria-label="搜索文章" style="width:190px;padding:7px 11px;font-size:0.84rem">
            <button class="btn-secondary" id="showEditorBtn">写文章</button>
          </div>
        </div>
        <div class="blog-tags" id="blogTags"></div>
        <div class="blog-posts-list" id="postsList">
          <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>读取中……</p>
          </div>
        </div>
      </div>

      <!-- 编辑器 -->
      <div id="editorView" style="display:none">
        <a href="#" class="back-link" id="backToListFromEditor">← 返回文章列表</a>
        <div class="blog-editor">
          <h3 id="editorTitle">写新文章</h3>
          <div class="form-group">
            <input type="text" id="postTitleInput" class="form-input" placeholder="文章标题" maxlength="200">
          </div>
          <div class="form-group">
            <input type="text" id="postTagsInput" class="form-input" placeholder="标签，用逗号分隔，如 OI, 题解, DP" maxlength="500">
          </div>
          <div class="editor-workspace">
            <div class="editor-pane">
              <div class="pane-label">正文 · Markdown + LaTeX</div>
              <textarea id="postContentInput" class="form-input form-textarea editor-textarea" placeholder="支持 Markdown 语法和 $\LaTeX$ 公式&#10;&#10;# 标题&#10;**粗体** *斜体*&#10;- 列表&#10;&#10;行内公式: $E=mc^2$&#10;块公式: $$\sum_{i=1}^{n} x_i$$&#10;&#10;```cpp&#10;int main() { return 0; }&#10;```"></textarea>
            </div>
            <div class="preview-pane">
              <div class="pane-label">预览</div>
              <div class="preview-content" id="livePreview">
                <p style="color:#9B978C">左侧输入，这里同步预览。</p>
              </div>
            </div>
          </div>
          <div id="editorFeedback" class="form-feedback" style="display:none"></div>
          <div class="blog-editor-actions">
            <button class="btn btn-primary" id="savePostBtn">发布</button>
            <button class="btn-secondary" id="cancelEditBtn">取消</button>
            <button class="btn-danger btn-sm" id="deletePostBtn" style="display:none;margin-left:auto">删除文章</button>
          </div>
        </div>
      </div>

      <!-- 详情 -->
      <div id="detailView" style="display:none">
        <a href="#" class="back-link" id="backToListFromDetail">← 返回文章列表</a>
        <div class="post-detail-layout">
          <div class="post-toc" id="postToc" style="display:none">
            <div class="toc-title">目录</div>
            <nav class="toc-nav" id="tocNav"></nav>
          </div>
          <div class="post-full" id="postFull"></div>
        </div>
      </div>

    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="blog.js"></script>
  <script>
    fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: '/blog' }) })
      .then(r => r.json())
      .then(d => {
        var el = document.createElement('p');
        el.className = 'page-views';
        el.textContent = '本页 ' + d.total + ' 次访问';
        document.querySelector('.blog-section .container').appendChild(el);
      })
      .catch(() => {});
  </script>
</body>
</html>
