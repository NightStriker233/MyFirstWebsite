<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱 - NightStriker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">✦ NightStriker</a>
      <div class="nav-links">
        <a href="index.html#about">关于我</a>
        <a href="index.html#messages">留言板</a>
        <a href="blog.html">博客</a>
        <a href="tools.html" style="color:#1E293B;font-weight:700">工具箱</a>
        <a href="games.html">游戏</a>
      </div>
    </div>
  </nav>

  <section class="tools-section">
    <div class="container">
      <h1 class="tools-title">🧰 工具箱</h1>

      <!-- Tab 导航 -->
      <div class="tools-tabs" id="tabsNav">
        <button class="tools-tab active" data-tab="base64">🔐 Base64</button>
        <button class="tools-tab" data-tab="diff">🔍 Diff</button>
        <button class="tools-tab" data-tab="random">🎲 随机数</button>
        <button class="tools-tab" data-tab="clips">📋 剪切板</button>
        <button class="tools-tab" data-tab="graph">🕸 图论</button>
        <button class="tools-tab" data-tab="runner">▶ 代码运行</button>
        <button class="tools-tab" data-tab="table">📊 表格</button>
        <button class="tools-tab" data-tab="base">🔢 进制</button>
      </div>

      <!-- ==================== Base64 ==================== -->
      <div class="tools-panel active" id="panel-base64">
        <div class="tool-grid">
          <div class="tool-col">
            <label class="tool-label">明文</label>
            <textarea id="base64Input" class="tool-textarea" placeholder="输入要编码的文本……" rows="6"></textarea>
          </div>
          <div class="tool-col">
            <label class="tool-label">Base64</label>
            <textarea id="base64Output" class="tool-textarea" placeholder="输入要解码的 Base64……" rows="6"></textarea>
          </div>
        </div>
        <div class="tool-actions">
          <button class="btn btn-primary" id="base64EncodeBtn">明文 → Base64</button>
          <button class="btn-secondary" id="base64DecodeBtn">Base64 → 明文</button>
          <button class="btn-secondary btn-sm" id="base64CopyBtn">📋 复制结果</button>
        </div>
        <div id="base64Feedback" class="form-feedback" style="display:none"></div>
      </div>

      <!-- ==================== Diff ==================== -->
      <div class="tools-panel" id="panel-diff">
        <div class="tool-grid">
          <div class="tool-col">
            <label class="tool-label">原始文本</label>
            <textarea id="diffOld" class="tool-textarea" placeholder="粘贴原始文本……" rows="8"></textarea>
          </div>
          <div class="tool-col">
            <label class="tool-label">新文本</label>
            <textarea id="diffNew" class="tool-textarea" placeholder="粘贴新文本……" rows="8"></textarea>
          </div>
        </div>
        <div class="tool-actions">
          <button class="btn btn-primary" id="diffBtn">对比差异</button>
          <button class="btn-secondary btn-sm" id="diffClearBtn">清空</button>
        </div>
        <div class="diff-output" id="diffOutput" style="display:none"></div>
      </div>

      <!-- ==================== 随机数 ==================== -->
      <div class="tools-panel" id="panel-random">
        <div class="random-form">
          <div class="random-row">
            <div class="random-field">
              <label class="tool-label">最小值</label>
              <input type="number" id="randMin" class="form-input" value="1">
            </div>
            <div class="random-field">
              <label class="tool-label">最大值</label>
              <input type="number" id="randMax" class="form-input" value="100">
            </div>
            <div class="random-field">
              <label class="tool-label">生成个数</label>
              <input type="number" id="randCount" class="form-input" value="10" min="1" max="10000">
            </div>
            <div class="random-field">
              <label class="tool-label">小数位数</label>
              <input type="number" id="randDecimals" class="form-input" value="0" min="0" max="10">
            </div>
          </div>
          <div class="random-checks">
            <label><input type="checkbox" id="randUnique"> 去重</label>
            <label><input type="checkbox" id="randSort"> 排序</label>
          </div>
          <div class="tool-actions">
            <button class="btn btn-primary" id="randBtn">生成</button>
            <button class="btn-secondary btn-sm" id="randCopyBtn">📋 复制</button>
          </div>
          <textarea id="randOutput" class="tool-textarea" rows="4" readonly placeholder="结果将显示在这里……"></textarea>
        </div>
      </div>

      <!-- ==================== 剪切板分享 ==================== -->
      <div class="tools-panel" id="panel-clips">
        <div class="clips-create">
          <label class="tool-label">粘贴你要分享的文本</label>
          <textarea id="clipsContent" class="tool-textarea" placeholder="支持代码、笔记、日志……最大 50KB" rows="6"></textarea>
          <div class="clips-options">
            <label><input type="checkbox" id="clipsBurn"> 阅后即焚（查看一次后自动删除）</label>
            <label>有效期：
              <select id="clipsExpire" class="form-input" style="width:auto;display:inline-block;padding:6px 12px">
                <option value="0">永不过期</option>
                <option value="1">1 小时</option>
                <option value="24">24 小时</option>
                <option value="168">7 天</option>
              </select>
            </label>
          </div>
          <div class="tool-actions">
            <button class="btn btn-primary" id="clipsCreateBtn">生成分享链接</button>
          </div>
          <div id="clipsResult" class="clips-result" style="display:none"></div>
          <div id="clipsFeedback" class="form-feedback" style="display:none"></div>
        </div>
      </div>

      <!-- ==================== 图论生成器 ==================== -->
      <div class="tools-panel" id="panel-graph">
        <div class="graph-toolbar">
          <div class="graph-input-row">
            <div class="graph-input-col" style="flex:0 0 auto">
              <label class="tool-label">节点</label>
              <input type="number" id="graphNodeCount" class="form-input" value="" placeholder="自动" min="1" max="26" style="width:70px">
            </div>
            <div class="graph-input-col" style="flex:0 0 auto">
              <label class="tool-label">索引</label>
              <div class="toggle-group" id="graphIndexMode">
                <button class="toggle-btn active" data-val="1">1-index</button>
                <button class="toggle-btn" data-val="0">0-index</button>
              </div>
            </div>
            <div class="graph-input-col" style="flex:0 0 auto">
              <label class="tool-label">类型</label>
              <div class="toggle-group" id="graphDirected">
                <button class="toggle-btn active" data-val="1">有向</button>
                <button class="toggle-btn" data-val="0">无向</button>
              </div>
            </div>
            <div class="graph-input-col" style="flex:1">
              <label class="tool-label">边数据（每行：起点 终点 [权值]）</label>
              <textarea id="graphEdgeInput" class="tool-textarea graph-edge-input" placeholder="1 2 5&#10;2 3 3&#10;1 3 8" rows="4"></textarea>
            </div>
          </div>
          <div class="tool-actions">
            <button class="btn-primary btn-sm" id="graphExportBtn">📤 导出矩阵</button>
            <button class="btn-secondary btn-sm" id="graphClearBtn">🗑 清空</button>
            <span id="graphStats" style="font-size:0.82rem;color:#94A3B8;margin-left:8px"></span>
          </div>
        </div>
        <div id="graphHint" class="form-feedback" style="display:none"></div>
        <div class="graph-canvas-wrap">
          <svg id="graphSvg" class="graph-svg"></svg>
        </div>
        <div class="graph-export" id="graphExportPanel" style="display:none">
          <label class="tool-label">邻接矩阵 / 边列表</label>
          <textarea id="graphExportText" class="tool-textarea" rows="6" readonly></textarea>
          <button class="btn-secondary btn-sm" id="graphCopyBtn2">📋 复制</button>
        </div>
      </div>

      <!-- ==================== 在线代码运行器 ==================== -->
      <div class="tools-panel" id="panel-runner">
        <div class="runner-notice">
          ⚠️ 使用 <strong>Wandbox</strong> 在线编译（C++ gcc-head / Python 3.12）。
          更多选项前往 <a href="https://wandbox.org/" target="_blank" style="color:#4F46E5">Wandbox.org</a>。
        </div>
        <div class="runner-topbar">
          <select id="runnerLang" class="form-input" style="width:auto">
            <option value="cpp">C++ (gcc-head, -std=c++20)</option>
            <option value="python">Python 3.12</option>
          </select>
          <button class="btn btn-primary" id="runnerBtn">▶ 运行代码</button>
          <span id="runnerStatus" style="font-size:0.85rem;color:#94A3B8"></span>
        </div>
        <div class="runner-main">
          <div class="runner-editor-wrap">
            <div class="runner-editor" id="runnerEditor"></div>
          </div>
          <div class="runner-io">
            <label class="tool-label">测试输入（每组用 === 分隔）</label>
            <textarea id="runnerInput" class="tool-textarea" placeholder="输入数据……&#10;===&#10;第二组输入……" rows="4"></textarea>
            <label class="tool-label">输出结果</label>
            <div class="runner-output" id="runnerOutput">
              <p style="color:#94A3B8">点击运行查看结果……</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== Markdown 表格生成器 ==================== -->
      <div class="tools-panel" id="panel-table">
        <div class="random-row" style="grid-template-columns: repeat(4,1fr);margin-bottom:12px">
          <div class="random-field"><label class="tool-label">行数</label><input type="number" id="tableRows" class="form-input" value="3" min="1" max="20"></div>
          <div class="random-field"><label class="tool-label">列数</label><input type="number" id="tableCols" class="form-input" value="3" min="1" max="10"></div>
          <div class="random-field" style="align-self:end"><button class="btn btn-primary" id="tableBuild">生成表格</button></div>
        </div>
        <div id="tableEditor" style="overflow-x:auto"></div>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
          <button class="btn-secondary btn-sm" id="tableExportMd">📋 复制 Markdown</button>
          <span id="tableFeedback" style="font-size:0.8rem;color:#94A3B8"></span>
        </div>
      </div>

      <!-- ==================== 进制转换器 ==================== -->
      <div class="tools-panel" id="panel-base">
        <div class="random-row" style="margin-bottom:12px">
          <div class="random-field"><label class="tool-label">输入数值</label><input type="text" id="baseInput" class="form-input" placeholder="如 255 / 0xFF / 0b1111"></div>
        </div>
        <div class="base-grid">
          <div class="base-card"><div class="base-label">十进制 (DEC)</div><code id="baseDec">—</code></div>
          <div class="base-card"><div class="base-label">十六进制 (HEX)</div><code id="baseHex">—</code></div>
          <div class="base-card"><div class="base-label">八进制 (OCT)</div><code id="baseOct">—</code></div>
          <div class="base-card"><div class="base-label">二进制 (BIN)</div><code id="baseBin">—</code></div>
        </div>
        <div style="margin-top:16px">
          <label class="tool-label">位运算</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-secondary btn-sm base-op" data-op="&">&amp; (与)</button>
            <button class="btn-secondary btn-sm base-op" data-op="|">| (或)</button>
            <button class="btn-secondary btn-sm base-op" data-op="^">^ (异或)</button>
            <button class="btn-secondary btn-sm base-op" data-op="~">~ (非)</button>
            <button class="btn-secondary btn-sm base-op" data-op="<<">&lt;&lt; (左移)</button>
            <button class="btn-secondary btn-sm base-op" data-op=">>">&gt;&gt; (右移)</button>
            <input type="text" id="baseOpVal" class="form-input" placeholder="操作数" style="width:100px">
            <span id="baseOpResult" style="font-size:0.9rem;font-weight:600;align-self:center"></span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="tools.js"></script>
</body>
</html>
